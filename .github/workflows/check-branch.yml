name: Enforce Branch Flow

on:
  pull_request:
    # Nên để cả dev để workflow chạy và trả về "Xanh" (Pass) cho dev
    branches: [ "main", "dev" ] 

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Flow
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"
          
          echo "Debug: Merging $SOURCE_BRANCH -> $TARGET_BRANCH"

          # --- RULE 1: Nếu đích là MAIN ---
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            if [[ "$SOURCE_BRANCH" != "dev" ]]; then
              echo "❌ ERROR: Bạn chỉ được phép merge vào MAIN từ nhánh DEV."
              exit 1
            fi
          fi

          # --- RULE 2: Nếu đích là DEV (Tuỳ chọn - để chặn merge bậy bạ) ---
          # Ví dụ: Chặn không cho merge ngược từ main vào dev
          if [[ "$TARGET_BRANCH" == "dev" ]]; then
             if [[ "$SOURCE_BRANCH" == "main" ]]; then
                echo "❌ ERROR: Không được merge ngược từ MAIN vào DEV."
                exit 1
             fi
             # Còn lại (feat/..., fix/...) thì cho qua
             echo "✅ Valid feature branch merge."
          fi
          
          echo "✅ All branch checks passed."